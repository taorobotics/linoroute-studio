server {
    listen 443 ssl http2;
    server_name mcp.linoroute.com;
    ssl_certificate /etc/letsencrypt/live/mcp.linoroute.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.linoroute.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mcp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    if ($host != mcp.linoroute.com) { return 421; }

    client_max_body_size 8m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 15s;
        access_log off;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header MCP-Session-Id $http_mcp_session_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control no-store always;
        access_log off;
        error_log /var/log/nginx/linoroute-mcp-error.log crit;
    }

    location / { return 404; }
}
