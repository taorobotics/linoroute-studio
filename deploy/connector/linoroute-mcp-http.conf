server {
    listen 80;
    server_name mcp.linoroute.com;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/linoroute-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://mcp.linoroute.com$request_uri;
    }
}
