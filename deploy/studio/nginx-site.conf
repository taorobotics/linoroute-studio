# Shared by the loopback verification server and the public HTTPS server.
root /opt/linoroute-studio/current/site;
index index.html;
server_tokens off;
autoindex off;
include /etc/nginx/linoroute-studio/nginx-security.conf;
access_log /var/log/nginx/studio-access.log studio_minimal;
error_log /var/log/nginx/studio-error.log crit;
client_max_body_size 30m;
client_body_buffer_size 30m;
client_body_timeout 30s;
send_timeout 60s;
keepalive_timeout 30s;
gzip on;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "studio ready\n";
}
location = /studio-error.json {
    internal;
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control no-store always;
}
location = /studio-storage/v1/uploads {
    if ($args != "") { return 404; }
    if ($request_method != POST) { return 404; }
    if ($studio_bad_origin) { return 403; }
    if ($studio_missing_post_origin) { return 403; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    if ($studio_valid_key = 0) { return 401; }
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    limit_req zone=studio_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn studio_connections 6;
    limit_conn_status 429;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type application/json;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:4181/v1/uploads;
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control no-store always;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 413 415 429 500 502 503 504 /studio-error.json;
    access_log /var/log/nginx/studio-storage-access.log studio_minimal;
    error_log /dev/null crit;
}
location ^~ /studio-storage/ { return 404; }
location ^~ /studio-prompt-assets/ {
    if ($args != "") { return 404; }
    if ($request_method != GET) { return 404; }
    limit_req zone=studio_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn studio_total_connections 24;
    limit_conn_status 429;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:4181/v1/prompt-assets/;
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control no-store always;
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 413 415 429 500 502 503 504 /studio-error.json;
    access_log /var/log/nginx/studio-storage-access.log studio_minimal;
    error_log /dev/null crit;
}
location ^~ /studio-api/ {
    # Access restrictions run before any forwarding. The upstream validates
    # the actual user's key, balance, model access and task ownership.
    if ($args != "") { return 404; }
    if ($studio_endpoint = denied) { return 404; }
    if ($studio_bad_origin) { return 403; }
    if ($studio_missing_post_origin) { return 403; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    if ($studio_unauthorized) { return 401; }
    limit_req zone=studio_requests burst=20 nodelay;
    limit_req zone=studio_submissions burst=3 nodelay;
    limit_req_status 429;
    limit_conn studio_connections 6;
    limit_conn studio_total_connections 24;
    limit_conn_status 429;

    # No request-body disk buffering, no cache, no automatic paid retries.
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 240s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host linoroute.com;
    proxy_set_header Authorization $studio_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Connection "";
    proxy_set_header Accept application/json;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name linoroute.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    resolver 127.0.0.53 ipv6=off valid=60s;
    set $studio_upstream linoroute.com;
    proxy_pass https://$studio_upstream$studio_path;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control no-store always;
    proxy_intercept_errors on;
    error_page 400 401 402 403 404 405 408 409 413 415 422 429 500 502 503 504 /studio-error.json;
    error_page 301 302 303 307 308 =502 /studio-error.json;
    access_log /var/log/nginx/studio-api-access.log studio_minimal;
    error_log /dev/null crit;
}
location ~ (^|/)\. { return 404; }
location ^~ /src/ { return 404; }
location ^~ /static/ {
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location = /index.html {
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control no-cache always;
}
location / {
    include /etc/nginx/linoroute-studio/nginx-security.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri $uri/ =404;
}
