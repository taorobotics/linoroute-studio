# Included once in the Nginx http context. No credentials in this file.
map_hash_bucket_size 128;
map "$request_method:$uri" $studio_endpoint {
    default denied;
    "GET:/studio-api/api/pricing" public;
    "GET:/studio-api/v1/models" protected;
    "POST:/studio-api/v1/images/generations" protected;
    "POST:/studio-api/v1/images/edits" protected;
    "POST:/studio-api/v1beta/models/gemini-3-pro-image-preview:generateContent" protected;
    "POST:/studio-api/api/v3/contents/generations/tasks" protected;
    "POST:/studio-api/kling/v1/videos/text2video" protected;
    "POST:/studio-api/kling/v1/videos/image2video" protected;
    "POST:/studio-api/kling/v1/videos/omni-video" protected;
    "POST:/studio-api/tencent-vod/v1/aigc-video" protected;
    "POST:/studio-api/v1/videos" protected;
    "POST:/studio-api/v1/videos/generations" protected;
    "~^GET:/studio-api/(?:api/v3/contents/generations/tasks|kling/v1/videos/(?:text2video|image2video|omni-video)|tencent-vod/v1/query|v1/videos)/[a-zA-Z0-9_:.-]{1,240}$" protected;
}
map $http_authorization $studio_valid_key {
    default 0;
    "~^Bearer [A-Za-z0-9_.-]{3,512}$" 1;
}
map "$studio_endpoint:$studio_valid_key" $studio_unauthorized {
    default 0;
    "protected:0" 1;
}
map $studio_endpoint $studio_authorization {
    default $http_authorization;
    public "";
}
map $http_origin $studio_bad_origin {
    default 1;
    "" 0;
    "https://studio.linoroute.com" 0;
}
map "$request_method:$http_origin" $studio_missing_post_origin {
    default 0;
    "POST:" 1;
}
map $uri $studio_path {
    default "";
    ~^/studio-api(?<studio_forward_path>/.*)$ $studio_forward_path;
}
map $request_method $studio_submission_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=studio_requests:10m rate=4r/s;
limit_req_zone $studio_submission_key zone=studio_submissions:1m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=studio_connections:1m;
limit_conn_zone $server_name zone=studio_total_connections:1m;
# No IP, URI, query, headers, prompts or credentials in access logs.
log_format studio_minimal '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
