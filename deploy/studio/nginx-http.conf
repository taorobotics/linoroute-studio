# Default rejects unrelated Host values; existing main-site DNS is untouched.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}
server {
    listen 80;
    server_name studio.linoroute.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/linoroute-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Never accept API credentials on unencrypted HTTP.
    location ^~ /studio-api/ { return 403; }
    location ^~ /studio-storage/ { return 403; }
    location / { return 308 https://studio.linoroute.com$request_uri; }
}
server {
    listen 127.0.0.1:4180;
    server_name studio.linoroute.com;
    include /etc/nginx/linoroute-studio/nginx-site.conf;
}
